# Codemagic: builds the signed iPhone app and sends it to TestFlight.
# Start it by hand from the Codemagic dashboard (Start new build > ios-testflight).
#
# One-time setup (all in dashboards, nothing secret goes in this file):
#  1. App Store Connect > Users and Access > Integrations > App Store Connect API:
#     create a key with the App Manager role and download the .p8 file.
#  2. Codemagic > Settings > Integrations > Developer Portal: add that key
#     and name it exactly: nexurls_asc
#  3. Apple Developer > Identifiers: register the App ID com.nexurls.app with
#     Push Notifications ticked.
#  4. App Store Connect > Apps > New App: iOS, name NexURLs, bundle id com.nexurls.app.
#  5. (1.1.1) Apple Developer > Identifiers > com.nexurls.app: tick Associated Domains
#     (nexurls.com links open the app) and Sign in with Apple, save, then regenerate its
#     App Store profile and fetch it again in Codemagic.
#  6. (1.1.1) Apple Developer > Identifiers: register com.nexurls.app.NexWidget (the home
#     screen widget, no capabilities needed), make an App Store profile for it with the same
#     distribution certificate, and fetch it in Codemagic. ios_signing below picks up
#     profiles for com.nexurls.app.* on its own.

workflows:
  ios-testflight:
    name: iPhone to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: nexurls_asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nexurls.app
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy the web settings into the iPhone project
        script: npx cap sync ios
      - name: Use the signing profiles
        script: xcode-project use-profiles
      - name: Set the build number
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Build the app file
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
