# Codemagic: builds the signed iPhone app and sends it to TestFlight.
# Start it by hand from the Codemagic dashboard (Start new build > ios-testflight).
#
# One-time setup (all in dashboards, nothing secret goes in this file):
#  1. App Store Connect > Users and Access > Integrations > App Store Connect API:
#     create a key with the App Manager role and download the .p8 file.
#  2. Codemagic > Settings > Integrations > Developer Portal: add that key
#     and name it exactly: nexurls_asc
#  3. Apple Developer > Identifiers: register the App ID com.nexurls.app with
#     Push Notifications ticked.
#  4. App Store Connect > Apps > New App: iOS, name NexURLs, bundle id com.nexurls.app.
#  5. (1.1.1) Apple Developer > Identifiers > com.nexurls.app: tick Associated Domains
#     (nexurls.com links open the app) and Sign in with Apple, save, then regenerate its
#     App Store profile and fetch it again in Codemagic.
#  6. (1.1.1) Apple Developer > Identifiers: register com.nexurls.app.NexWidget (the home
#     screen widget, no capabilities needed), make an App Store profile for it with the same
#     distribution certificate, and fetch it in Codemagic. ios_signing below picks up
#     profiles for com.nexurls.app.* on its own.

workflows:
  ios-testflight:
    name: iPhone to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: nexurls_asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nexurls.app
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy the web settings into the iPhone project
        script: npx cap sync ios
      - name: Use the signing profiles
        script: xcode-project use-profiles
      - name: Set the build number
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Build the app file
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ---------------------------------------------------------------------------
  # Android (Google Play). Two workflows:
  #
  # android-upload-key: run ONCE. Makes the Play upload key on Codemagic's machine and
  #   leaves it in that build's Artifacts: nexurls-upload.jks and nexurls-upload-key.txt
  #   (the passwords and alias). Download both and keep them somewhere safe (a password
  #   manager). Then Codemagic > Team settings > Code signing identities > Android
  #   keystores > Add: upload nexurls-upload.jks, type the details from the .txt file,
  #   and name the reference exactly: nexurls_upload. Nothing secret goes in this file.
  #   Google Play App Signing holds the real app key, so a lost upload key can be reset
  #   in Play Console.
  #
  # android-play: builds the signed Android App Bundle (.aab) for Google Play. The first
  #   upload is done by hand in Play Console (Test and release > create a release > upload
  #   the .aab from this build's Artifacts). Automatic uploads can be added after that.
  # ---------------------------------------------------------------------------
  android-upload-key:
    name: Android upload key (run once)
    max_build_duration: 10
    instance_type: mac_mini_m2
    scripts:
      - name: Make the upload key
        script: |
          set -e
          mkdir -p out
          PASS=$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 28)
          keytool -genkeypair -v \
            -keystore out/nexurls-upload.jks \
            -storetype JKS \
            -alias nexurls-upload \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=NexURLs, O=Qubi Labs LLC, C=US"
          printf "Keystore file: nexurls-upload.jks\nKeystore password: %s\nKey alias: nexurls-upload\nKey password: %s\n" "$PASS" "$PASS" > out/nexurls-upload-key.txt
    artifacts:
      - out/nexurls-upload.jks
      - out/nexurls-upload-key.txt

  android-play:
    name: Android for Google Play
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
      android_signing:
        - nexurls_upload
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy the web settings into the Android project
        script: npx cap sync android
      - name: Build the signed app bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/mapping.txt
