# Downloads a picture from a web address into resources/ and commits it.
# Used to bring the website's app icon into the project. Run from the Actions tab or the API.
name: Fetch icon

on:
  workflow_dispatch:
    inputs:
      url:
        description: Picture address
        required: true
      name:
        description: File name to save as inside resources/
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          SRC: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
        run: |
          case "$NAME" in *[!A-Za-z0-9._-]*) echo "Bad name"; exit 1;; esac
          curl -fsSL "$SRC" -o "resources/$NAME"
          file "resources/$NAME"
      - name: Save
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "resources/$NAME"
          git commit -m "Fetch $NAME" || echo "No changes"
          git push
