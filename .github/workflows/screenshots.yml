# App Store screenshots from the iPhone simulator (6.9 inch, 1320 x 2868).
# Run it from the Actions tab (Screenshots > Run workflow). The pictures are saved
# into the repository under screenshots/ios-6.9/.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages and copy the web settings
        run: |
          npm ci
          npx cap sync ios

      - name: Pick the largest iPhone simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then UDID=$(xcrun simctl list devices available | grep -E "iPhone.*Pro Max" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'); fi
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build the app for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Take the screenshots
        env:
          NEX_SHOT_USER: ${{ secrets.NEX_SHOT_USER }}
          NEX_SHOT_PASS: ${{ secrets.NEX_SHOT_PASS }}
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          OUT=screenshots/ios-6.9
          mkdir -p "$OUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

          fresh() { xcrun simctl uninstall "$UDID" com.nexurls.app || true; xcrun simctl install "$UDID" "$APP"; }
          shot() {
            name="$1"; wait="$2"; shift 2
            xcrun simctl terminate "$UDID" com.nexurls.app || true
            xcrun simctl launch "$UDID" com.nexurls.app -NexShot "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "$OUT/$name.png"
            echo "::notice::Saved $name"
          }

          # First launch: onboarding.
          fresh
          shot 01-onboarding 8 -NexShowOnboarding -NexShowGate
          # Fresh again: the welcome screen with Join and Sign in.
          fresh
          shot 02-welcome 16 -NexShowGate
          # Everything else without the welcome screen.
          shot 03-home 16
          shot 04-next 22 -NexURL "https://nexurls.com/?go=1"
          shot 05-explore 16 -NexURL "https://nexurls.com/explore/"
          shot 06-reels 20 -NexURL "https://nexurls.com/reels/"
          shot 07-community 16 -NexURL "https://nexurls.com/?qcf_feed=1"
          shot 08-fresh 16 -NexURL "https://nexurls.com/explore/?mode=fresh"
          # The Pro page signed out shows the plans (used for the purchase review screenshots).
          shot 14-pro 18 -NexURL "https://nexurls.com/pro/" \
            -NexJS "setTimeout(function(){var p=document.querySelector('.nexu-pro-plans');if(p)p.scrollIntoView({block:'center'});},6000);"

          # Signed in as a free member, when the repository has the secrets
          # NEX_SHOT_USER and NEX_SHOT_PASS (a dummy member, never an admin).
          if [ -n "$NEX_SHOT_USER" ] && [ -n "$NEX_SHOT_PASS" ]; then
            JAR=$(mktemp)
            curl -s -o /dev/null -c "$JAR" -b "wordpress_test_cookie=WP%20Cookie%20check" \
              -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 NexURLsApp" \
              --data-urlencode "log=$NEX_SHOT_USER" --data-urlencode "pwd=$NEX_SHOT_PASS" \
              --data "rememberme=forever&testcookie=1&redirect_to=https%3A%2F%2Fnexurls.com%2F" \
              https://nexurls.com/wp-login.php
            CK=$(awk -F'\t' 'NF>=7 && $6 != "" {printf "%s=%s; ", $6, $7}' "$JAR")
            rm -f "$JAR"
            if echo "$CK" | grep -q "wordpress_logged_in_"; then
              echo "::notice::Signed in for the member screenshots"
              shot 09-home-in 18 -NexCookies "$CK" -NexURL "https://nexurls.com/app/"
              shot 10-community-in 22 -NexCookies "$CK" -NexURL "https://nexurls.com/?qcf_feed=1" \
                -NexJS "var c=function(l){var e=document.querySelectorAll('a,button');for(var k=0;k<e.length;k++){var t=(e[k].textContent||'').trim();if(l.indexOf(t)>-1&&e[k].offsetParent){e[k].click();return 1;}}return 0;};setTimeout(function(){c(['Skip for now','Skip, surprise me']);},4000);setTimeout(function(){c(['Skip']);},6500);"
              shot 11-fullscreen 34 -NexCookies "$CK" -NexURL "https://nexurls.com/explore/" \
                -NexJS "var c=function(l){var e=document.querySelectorAll('a,button');for(var k=0;k<e.length;k++){var t=(e[k].textContent||'').trim();if(l.indexOf(t)>-1&&e[k].offsetParent){e[k].click();return 1;}}return 0;};setTimeout(function(){c(['Skip for now','Skip, surprise me']);},4000);setTimeout(function(){c(['Skip']);},6500);setTimeout(function(){c(['Take me somewhere','Next','Next →']);},9000);"
              shot 12-reels-in 22 -NexCookies "$CK" -NexURL "https://nexurls.com/reels/"
              shot 13-dashboard-in 22 -NexCookies "$CK" -NexURL "https://nexurls.com/dashboard/" \
                -NexJS "setTimeout(function(){var p=document.querySelector('.nxd-packs');if(p)p.scrollIntoView({block:'center'});},6000);"
            else
              echo "::warning::Sign-in did not work, so the member screenshots were skipped"
            fi
          else
            echo "::notice::No NEX_SHOT_USER / NEX_SHOT_PASS secrets, member screenshots skipped"
          fi

          # Copies for the 6.3 inch slot (1206 x 2622).
          mkdir -p screenshots/ios-6.3
          for f in "$OUT"/*.png; do sips -z 2622 1206 "$f" --out "screenshots/ios-6.3/$(basename "$f")" >/dev/null; done
          ls -la "$OUT" screenshots/ios-6.3

      - name: Save the screenshots to the repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add screenshots
          git commit -m "App Store screenshots (iPhone 6.9 inch)" || echo "No changes"
          git push
